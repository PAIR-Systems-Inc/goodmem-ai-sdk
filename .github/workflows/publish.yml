name: Publish to npm

# Publishes the package when it runs on a `v*` tag. Tags are not pushed by
# hand: release-on-merge.yml creates `v<version>` when a merged change bumps
# package.json's version, then starts this workflow on that tag. (A tag
# created with GITHUB_TOKEN does not trigger push workflows, hence the
# explicit dispatch; a hand-pushed tag still works through the push trigger.)
#
# Authentication uses npm Trusted Publishing (OpenID Connect); no NPM_TOKEN
# is stored. One-time setup on npmjs.com, in the package's settings under
# "Trusted publishers":
#   Provider:    GitHub Actions
#   Repository:  PAIR-Systems-Inc/goodmem-vercel-ai-sdk
#   Workflow:    publish.yml
#   Environment: npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: npm ci

      - name: Types
        run: npx tsc --noEmit

      - name: Offline suite
        run: env -u GOODMEM_API_KEY -u GOODMEM_BASE_URL -u GOODMEM_TEST_EMBEDDER_ID npm test

      - name: Build
        run: npm run build

      - name: README check against the built types
        run: npm run check:readme

      - name: Pack
        run: npm pack

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: "*.tgz"

  publish:
    name: Publish to npm
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@pairsystems/goodmem-vercel-ai-sdk
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: The tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match package.json version $VERSION."
            exit 1
          fi

      - name: Upgrade npm for Trusted Publishing support
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish via Trusted Publishing
        run: npm publish --provenance --access public
